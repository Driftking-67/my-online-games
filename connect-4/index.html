<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4</title>
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    :root {
      --board: #2457c5;
      --red: #e63946;
      --yellow: #ffd23f;
      --win-ring: #ffffff;
    }
    :root[data-theme="light"] { --win-ring: #1e1e2e; }
    h1 { margin: 0 0 4px; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 8px 0;
    }
    #status {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 10px 0;
      min-height: 1.6em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-block;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      background: var(--board);
      padding: 10px;
      border-radius: 14px;
      width: min(92vw, 520px);
      box-shadow: 0 10px 30px var(--shadow);
    }
    .cell {
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--hole);
      cursor: pointer;
      position: relative;
    }
    .cell.red { background: var(--red); }
    .cell.yellow { background: var(--yellow); }
    .cell.drop { animation: drop 0.35s ease-in; }
    .cell.win { box-shadow: 0 0 0 4px var(--win-ring) inset; }
    #board.locked .cell { cursor: default; }
    .col-hover { filter: brightness(1.3); }
    @keyframes drop {
      from { transform: translateY(-300%); }
      to { transform: translateY(0); }
    }
    .score {
      margin-top: 14px;
      color: var(--muted);
      display: flex;
      gap: 18px;
    }
  </style>
</head>
<body>
  <main class="page">
  <h1>Connect 4</h1>

  <div class="controls">
    <button id="mode2p" class="active">2 Players</button>
    <button id="modeAI">vs Computer</button>
    <button id="newGame">New Game</button>
  </div>

  <div id="status"></div>
  <div id="board"></div>

  <div class="score">
    <span>🔴 Red: <b id="scoreRed">0</b></span>
    <span>🟡 Yellow: <b id="scoreYellow">0</b></span>
    <span>Ties: <b id="scoreTie">0</b></span>
  </div>
  </main>

  <script>
    const ROWS = 6, COLS = 7;
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    let grid, current, gameOver, vsAI = false;
    const scores = { red: 0, yellow: 0, tie: 0 };

    // Build cells once
    const cells = [];
    for (let r = 0; r < ROWS; r++) {
      cells.push([]);
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.col = c;
        cell.addEventListener('click', () => humanMove(c));
        cell.addEventListener('mouseenter', () => highlightCol(c, true));
        cell.addEventListener('mouseleave', () => highlightCol(c, false));
        boardEl.appendChild(cell);
        cells[r].push(cell);
      }
    }

    function highlightCol(c, on) {
      if (gameOver) return;
      for (let r = 0; r < ROWS; r++) {
        if (!grid[r][c]) cells[r][c].classList.toggle('col-hover', on);
      }
    }

    function newGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      current = 'red';
      gameOver = false;
      boardEl.classList.remove('locked');
      cells.flat().forEach(el => el.className = 'cell');
      updateStatus();
    }

    function updateStatus(text) {
      const name = current === 'red' ? 'Red' : 'Yellow';
      const who = vsAI ? (current === 'red' ? 'Your turn' : 'Computer is thinking…') : `${name}'s turn`;
      statusEl.innerHTML = `<span class="dot" style="background:var(--${current})"></span>${text || who}`;
    }

    function lowestEmpty(g, c) {
      for (let r = ROWS - 1; r >= 0; r--) if (!g[r][c]) return r;
      return -1;
    }

    function humanMove(c) {
      if (gameOver) return;
      if (vsAI && current === 'yellow') return;
      play(c);
    }

    function play(c) {
      const r = lowestEmpty(grid, c);
      if (r < 0) return;
      grid[r][c] = current;
      const el = cells[r][c];
      el.classList.remove('col-hover');
      el.classList.add(current, 'drop');

      const win = findWin(grid, r, c);
      if (win) {
        win.forEach(([wr, wc]) => cells[wr][wc].classList.add('win'));
        const name = current === 'red' ? 'Red' : 'Yellow';
        endGame(vsAI ? (current === 'red' ? 'You win! 🎉' : 'Computer wins!') : `${name} wins! 🎉`);
        scores[current]++;
        renderScores();
        return;
      }
      if (grid[0].every(Boolean)) {
        current = 'tie';
        statusEl.textContent = "It's a tie!";
        gameOver = true;
        boardEl.classList.add('locked');
        scores.tie++;
        renderScores();
        return;
      }
      current = current === 'red' ? 'yellow' : 'red';
      updateStatus();

      if (vsAI && current === 'yellow') {
        boardEl.classList.add('locked');
        setTimeout(() => {
          boardEl.classList.remove('locked');
          play(bestMove());
        }, 500);
      }
    }

    function endGame(text) {
      gameOver = true;
      boardEl.classList.add('locked');
      updateStatus(text);
    }

    function renderScores() {
      document.getElementById('scoreRed').textContent = scores.red;
      document.getElementById('scoreYellow').textContent = scores.yellow;
      document.getElementById('scoreTie').textContent = scores.tie;
    }

    // Returns the 4+ winning cells through (r, c), or null
    function findWin(g, r, c) {
      const p = g[r][c];
      const dirs = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of dirs) {
        const line = [[r, c]];
        for (const s of [1, -1]) {
          let rr = r + dr * s, cc = c + dc * s;
          while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && g[rr][cc] === p) {
            line.push([rr, cc]);
            rr += dr * s; cc += dc * s;
          }
        }
        if (line.length >= 4) return line;
      }
      return null;
    }

    // --- Computer player: minimax with alpha-beta, a few moves deep ---
    const ORDER = [3, 2, 4, 1, 5, 0, 6];

    function scoreWindow(w, me) {
      const opp = me === 'red' ? 'yellow' : 'red';
      const mine = w.filter(x => x === me).length;
      const theirs = w.filter(x => x === opp).length;
      const empty = w.filter(x => !x).length;
      if (mine === 3 && empty === 1) return 5;
      if (mine === 2 && empty === 2) return 2;
      if (theirs === 3 && empty === 1) return -4;
      return 0;
    }

    function evaluate(g, me) {
      let s = 0;
      for (let r = 0; r < ROWS; r++) if (g[r][3] === me) s += 3;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (c + 3 < COLS) s += scoreWindow([g[r][c], g[r][c+1], g[r][c+2], g[r][c+3]], me);
        if (r + 3 < ROWS) s += scoreWindow([g[r][c], g[r+1][c], g[r+2][c], g[r+3][c]], me);
        if (r + 3 < ROWS && c + 3 < COLS) s += scoreWindow([g[r][c], g[r+1][c+1], g[r+2][c+2], g[r+3][c+3]], me);
        if (r + 3 < ROWS && c - 3 >= 0) s += scoreWindow([g[r][c], g[r+1][c-1], g[r+2][c-2], g[r+3][c-3]], me);
      }
      return s;
    }

    function minimax(g, depth, alpha, beta, maximizing) {
      const me = 'yellow', opp = 'red';
      const moves = ORDER.filter(c => lowestEmpty(g, c) >= 0);
      if (depth === 0 || moves.length === 0) return evaluate(g, me);
      if (maximizing) {
        let best = -Infinity;
        for (const c of moves) {
          const r = lowestEmpty(g, c);
          g[r][c] = me;
          const val = findWin(g, r, c) ? 100000 + depth : minimax(g, depth - 1, alpha, beta, false);
          g[r][c] = null;
          best = Math.max(best, val);
          alpha = Math.max(alpha, val);
          if (alpha >= beta) break;
        }
        return best;
      } else {
        let best = Infinity;
        for (const c of moves) {
          const r = lowestEmpty(g, c);
          g[r][c] = opp;
          const val = findWin(g, r, c) ? -100000 - depth : minimax(g, depth - 1, alpha, beta, true);
          g[r][c] = null;
          best = Math.min(best, val);
          beta = Math.min(beta, val);
          if (alpha >= beta) break;
        }
        return best;
      }
    }

    function bestMove() {
      const g = grid.map(row => row.slice());
      let bestVal = -Infinity, choice = ORDER.find(c => lowestEmpty(g, c) >= 0);
      for (const c of ORDER) {
        const r = lowestEmpty(g, c);
        if (r < 0) continue;
        g[r][c] = 'yellow';
        const val = findWin(g, r, c) ? 1e6 : minimax(g, 4, -Infinity, Infinity, false);
        g[r][c] = null;
        if (val > bestVal) { bestVal = val; choice = c; }
      }
      return choice;
    }

    // --- Buttons ---
    const btn2p = document.getElementById('mode2p');
    const btnAI = document.getElementById('modeAI');
    btn2p.onclick = () => { vsAI = false; btn2p.classList.add('active'); btnAI.classList.remove('active'); newGame(); };
    btnAI.onclick = () => { vsAI = true; btnAI.classList.add('active'); btn2p.classList.remove('active'); newGame(); };
    document.getElementById('newGame').onclick = newGame;

    newGame();
  </script>
  <script type="module" src="../assets/header.js"></script>
</body>
</html>
