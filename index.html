<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Online Games</title>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    h1 { margin: 8px 0 6px; font-size: 2.2rem; text-align: center; }
    p.sub { margin: 0 0 28px; color: var(--muted); }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: min(100%, 720px);
    }
    a.game {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.game:hover { transform: translateY(-3px); border-color: var(--accent); }
    .icon { font-size: 2.5rem; }
    .name { font-size: 1.2rem; font-weight: 600; margin: 8px 0 4px; }
    .desc { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="page">
    <h1>Pick a game</h1>
    <p class="sub">More games coming soon</p>

    <div class="games">
      <a class="game" href="connect-4/">
        <div class="icon">🔴🟡</div>
        <div class="name">Connect 4</div>
        <div class="desc">Get four in a row. Play a friend or the computer.</div>
      </a>
    </div>
  </main>

  <script type="module" src="assets/header.js"></script>
</body>
</html>
