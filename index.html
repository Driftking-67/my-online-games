<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Online Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      color: #f5f5f5;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 0 0 6px; font-size: 2.2rem; }
    p.sub { margin: 0 0 28px; color: #a0a0b8; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: min(100%, 720px);
    }
    a.game {
      display: block;
      background: #2a2a3d;
      border: 1px solid #3a3a52;
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.game:hover { transform: translateY(-3px); border-color: #2457c5; }
    .icon { font-size: 2.5rem; }
    .name { font-size: 1.2rem; font-weight: 600; margin: 8px 0 4px; }
    .desc { color: #a0a0b8; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>🎮 My Online Games</h1>
  <p class="sub">Pick a game to play</p>

  <div class="games">
    <a class="game" href="connect-4/">
      <div class="icon">🔴🟡</div>
      <div class="name">Connect 4</div>
      <div class="desc">Get four in a row. Play a friend or the computer.</div>
    </a>
  </div>
</body>
</html>
